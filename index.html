<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nonsense Games</title>

    <link rel="stylesheet" href="assets/css/common.css">
</head>

<body>

    <main class="game-hall">

        <header class="hall-header">
            <h1>Nonsense Games</h1>
            <p>选择一个游戏开始</p>
        </header>

        <section class="game-list">

            <!-- 数独 -->
            <a class="game-card" href="sudoku/">
                <div class="game-icon">🧩</div>

                <div class="game-info">
                    <h2>数独</h2>
                    <p>我有废水过滤器，让我加个塞呗</p>
                </div>

                <div class="game-arrow">→</div>
            </a>


            <!-- 四川麻将 -->
            <a class="game-card" href="mahjong/">
                <div class="game-icon">🀄</div>

                <div class="game-info">
                    <h2>四川麻将</h2>
                    <p>海水过滤器都没有的家伙，还好意思来？</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 2048 -->
            <a class="game-card" href="2048/">
                <div class="game-icon">🔢</div>

                <div class="game-info">
                    <h2>2048</h2>
                    <p>哼！莫欺少年穷！</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 空当接龙 -->
            <a class="game-card" href="freecell/">
                <div class="game-icon">🃏</div>

                <div class="game-info">
                    <h2>空当接龙</h2>
                    <p>我这就去打捞海水过滤器！</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 蜘蛛纸牌 -->
            <a class="game-card" href="spider/">
                <div class="game-icon">♠️</div>

                <div class="game-info">
                    <h2>蜘蛛纸牌</h2>
                    <p>打捞海水过滤器，搬进高级避难所</p>
                </div>

                <div class="game-arrow">→</div>
            </a>


            <!-- 围棋 -->
            <a class="game-card" href="go/">
                <div class="game-icon">⚫</div>

                <div class="game-info">
                    <h2>围棋</h2>
                    <p>开局一定要先选海水过滤器！</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 五子棋 -->
            <a class="game-card" href="gomoku/">
                <div class="game-icon">⚪</div>

                <div class="game-info">
                    <h2>五子棋</h2>
                    <p>三分钟一把，超爽超解压</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 中国象棋 -->
            <a class="game-card" href="chinese_chess/">
                <div class="game-icon">♟️</div>

                <div class="game-info">
                    <h2>中国象棋</h2>
                    <p>疯狂水世界，启动！</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

        </section>

        <footer class="hall-footer">
            <p>© wscldyr</p>
        </footer>

    </main>

</body>
</html>

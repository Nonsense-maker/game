<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nonsense Games</title>

    <link rel="stylesheet" href="assets/css/common.css">
</head>

<body>

    <main class="game-hall">

        <header class="hall-header">
            <h1>Nonsense Games</h1>
            <p>选择一个游戏开始</p>
        </header>

        <section class="game-list">

            <!-- 数独 -->
            <a class="game-card" href="sudoku/">
                <div class="game-icon">🧩</div>

                <div class="game-info">
                    <h2>数独</h2>
                    <p>经典数字逻辑游戏</p>
                </div>

                <div class="game-arrow">→</div>
            </a>


            <!-- 四川麻将 -->
            <a class="game-card" href="mahjong/">
                <div class="game-icon">🀄</div>

                <div class="game-info">
                    <h2>四川麻将</h2>
                    <p>单人 · 血战到底</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 2048 -->
            <a class="game-card" href="2048/">
                <div class="game-icon">🔢</div>

                <div class="game-info">
                    <h2>2048</h2>
                    <p>经典数字合并游戏</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 空当接龙 -->
            <a class="game-card" href="freecell/">
                <div class="game-icon">🃏</div>

                <div class="game-info">
                    <h2>空当接龙</h2>
                    <p>经典纸牌策略游戏</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

            <!-- 蜘蛛纸牌 -->
            <a class="game-card" href="spider/">
                <div class="game-icon">♠️</div>

                <div class="game-info">
                    <h2>蜘蛛纸牌</h2>
                    <p>经典蜘蛛纸牌</p>
                </div>

                <div class="game-arrow">→</div>
            </a>

        </section>

        <footer class="hall-footer">
            <p>© Nonsense-maker</p>
        </footer>

    </main>

</body>
</html>

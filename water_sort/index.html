<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>试剂排序 · Water Sort</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">PUZZLE GAME</div>
      <h1>试剂排序</h1>
      <p>把不同颜色的液体整理到各自的试管中</p>
    </div>
    <div class="stats">
      <span>关卡 <b id="level">1</b></span>
      <span>步数 <b id="moves">0</b></span>
    </div>
  </header>

  <main>
    <div id="board" class="board"></div>

    <div class="controls">
      <button id="undo">↶ 撤销</button>
      <button id="restart">↻ 重开</button>
      <button id="next" class="primary" disabled>下一关 →</button>
    </div>

    <div id="message" class="message">点击一个试管，再点击另一个试管倒水</div>
  </main>
</div>
<script src="game.js"></script>
</body>
</html>

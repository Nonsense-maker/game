<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>四川麻将 · 血战到底</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle,#16734d,#0b4d35 60%,#063526);
    color:#fff;
    overflow-x:hidden
}

.topbar{
    height:60px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,.25)
}

.title{
    font-size:20px;
    font-weight:700
}

.back{
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.13);
    padding:8px 14px;
    border-radius:20px
}

.game{
    width:min(1100px,96vw);
    height:calc(100vh - 70px);
    min-height:840px;
    padding-bottom:200px;
    margin:auto;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center
}

.table{
    width:min(720px,72vw);
    height:520px;
    position:relative;
    border:14px solid #75461f;
    border-radius:30px;
    background:linear-gradient(145deg,#168254,#09603f);
    box-shadow:0 20px 50px rgba(0,0,0,.35)
}

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:220px;
    height:140px;
    border-radius:18px;
    background:rgba(0,0,0,.13);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center
}

.round{
    font-size:25px;
    font-weight:800
}

.status{
    font-size:14px;
    opacity:.9;
    min-height:24px
}

.player-prompt{
    position:absolute;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    width:min(430px,90vw);
    min-height:48px;
    padding:7px 12px;
    border-radius:12px;
    background:rgba(0,0,0,.28);
    text-align:center;
    z-index:25
}

.timer{
    min-height:16px;
    font-size:12px;
    color:#ffe28a
}

.wall{
    font-size:13px;
    opacity:.7
}

.player{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    z-index:5
}

.name{
    padding:4px 10px;
    border-radius:14px;
    background:rgba(0,0,0,.3);
    font-size:13px
}

.seat-info{
    display:block;
    margin-top:2px;
    font-size:11px;
    opacity:.82
}

.dealer-badge{
    color:#ffe28a;
    font-weight:700
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(145deg,#eee,#aaa);
    color:#333;
    border:3px solid rgba(255,255,255,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold
}

.north{
    left:50%;
    top:12px;
    transform:translateX(-50%)
}

.west{
    left:10px;
    top:50%;
    transform:translateY(-50%)
}

.east{
    right:10px;
    top:50%;
    transform:translateY(-50%)
}

.south{
    left:50%;
    bottom:10px;
    transform:translateX(-50%)
}

.active .name{
    background:#d6a743;
    color:#382604;
    font-weight:bold
}

.out{
    opacity:.42;
    filter:grayscale(1)
}

.ai-hand{
    display:flex;
    gap:2px
}

/* 四家的资料在牌桌外侧；牌桌内只保留手牌、弃牌和牌墙。 */
.seat-summary{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:20
}

.seat-summary-item{
    position:absolute;
    min-width:92px;
    padding:6px 8px;
    border-radius:10px;
    background:rgba(0,0,0,.30);
    font-size:12px;
    line-height:1.35;
    text-align:center
}

.seat-summary-item.active{
    background:#d6a743;
    color:#382604;
    box-shadow:0 0 0 3px rgba(255,226,138,.45),0 4px 12px rgba(0,0,0,.28);
    font-weight:700
}

.seat-summary-item.active .seat-info{opacity:.78}

#northInfo{left:50%;top:12px;transform:translateX(-50%)}
#southInfo{left:50%;bottom:155px;transform:translateX(-50%)}
#westInfo{left:0;top:50%;transform:translateY(-50%)}
#eastInfo{right:0;top:50%;transform:translateY(-50%)}

/* AI 手牌贴在各自牌桌边，不能参与普通文档流。 */
.ai-position{
    position:absolute;
    z-index:5;
    pointer-events:none
}

.ai-north{left:50%;top:28px;transform:translateX(-50%)}
.ai-west{left:20px;top:50%;transform:translateY(-50%)}
.ai-east{right:20px;top:50%;transform:translateY(-50%)}

.ai-tile{
    width:15px;
    height:22px;
    border-radius:3px;
    background:linear-gradient(135deg,#eee,#c8c8c8);
    border:1px solid #999;
    box-shadow:0 1px 2px rgba(0,0,0,.2)
}

.vertical .ai-hand{
    flex-direction:column
}

.vertical .ai-tile{
    width:22px;
    height:15px
}

.my-hand{
    position:absolute;
    left:50%;
    bottom:-62px;
    transform:translateX(-50%);
    display:flex;
    gap:2px;
    align-items:flex-end;
    white-space:nowrap;
    z-index:10
}

.my-melds{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    min-height:24px;
    z-index:10
}

.meld{
    display:flex;
    gap:1px;
    padding:3px;
    border-radius:5px;
    background:rgba(0,0,0,.18)
}

.meld-tile{
    width:22px;
    height:31px;
    border-radius:3px;
    background:#f3f3f3;
    border:1px solid #aaa;
    color:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold
}

.table-melds{position:absolute;display:flex;gap:4px;z-index:6;pointer-events:none}
.north-melds{top:58px;right:20px}
.west-melds{left:22px;bottom:25px;flex-direction:column}
.east-melds{right:22px;bottom:25px;flex-direction:column}
.table-melds .meld{padding:2px}
.concealed-meld .meld-tile{background:linear-gradient(135deg,#ececec,#b8b8b8);color:transparent}

.tile{
    width:39px;
    height:55px;
    border-radius:5px;
    background:linear-gradient(145deg,#fff,#e8e8e8);
    border:1px solid #aaa;
    color:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 3px 5px rgba(0,0,0,.28);
    cursor:pointer;
    transition:.15s
}

.tile:hover{
    transform:translateY(-7px)
}

.tile.selected{
    transform:translateY(-10px);
    box-shadow:0 0 0 2px #e0b44e
}

.tile.drawn{
    margin-left:10px;
    border-color:#d6a743;
    box-shadow:0 0 0 2px rgba(224,180,78,.55),0 3px 5px rgba(0,0,0,.28)
}

.discards{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    margin-top:105px;
    width:300px;
    min-height:70px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:flex-start;
    gap:3px;
    z-index:4
}

.player-discards{
    position:absolute;
    display:flex;
    flex-wrap:wrap;
    gap:2px;
    z-index:4
}

.player-discards .discard{width:20px;height:27px;font-size:12px}
.north-discards{left:50%;top:86px;transform:translateX(-50%);width:185px;justify-content:center}
.west-discards{left:62px;top:50%;transform:translateY(-50%);width:27px;flex-direction:column;align-items:center}
.east-discards{right:62px;top:50%;transform:translateY(-50%);width:27px;flex-direction:column;align-items:center}
.south-discards{left:50%;bottom:110px;transform:translateX(-50%);width:185px;justify-content:center}
.north-discards .discard{transform:rotate(180deg)}
.west-discards .discard{transform:rotate(90deg);margin:2px 0}
.east-discards .discard{transform:rotate(-90deg);margin:2px 0}

.discard{
    width:25px;
    height:34px;
    background:#f3f3f3;
    color:#222;
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    box-shadow:0 2px 3px rgba(0,0,0,.25)
}

.controls{
    position:absolute;
    bottom:10px;
    right:0;
    display:flex;
    gap:8px;
    z-index:30
}

button{
    border:0;
    border-radius:9px;
    padding:10px 18px;
    font-weight:600;
    cursor:pointer;
    background:#fff;
    color:#174d37;
    box-shadow:0 3px 8px rgba(0,0,0,.25)
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

button.primary{
    background:#e0b44e;
    color:#382604
}

.start{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(4px);
    border-radius:18px
}

.start.hidden{
    display:none
}

.result{
    position:absolute;
    inset:0;
    z-index:110;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(5px);
    border-radius:18px
}

.result.hidden{
    display:none
}

.result-card{
    width:min(390px,88vw);
    padding:28px 24px;
    border-radius:20px;
    text-align:center;
    background:rgba(20,70,50,.98);
    box-shadow:0 20px 50px rgba(0,0,0,.45)
}

.result-card h2{
    font-size:26px;
    margin-bottom:10px
}

.result-message{
    color:rgba(255,255,255,.8);
    line-height:1.5;
    margin-bottom:14px
}

.result-list{
    margin:0 0 20px;
    padding:0;
    list-style:none;
    text-align:left
}

.result-list li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 10px;
    margin-top:6px;
    border-radius:8px;
    background:rgba(255,255,255,.1)
}

.result-list small{
    color:rgba(255,255,255,.7)
}

.card{
    width:min(360px,88vw);
    padding:30px 25px;
    border-radius:20px;
    text-align:center;
    background:rgba(20,70,50,.97);
    box-shadow:0 20px 50px rgba(0,0,0,.4)
}

.card h1{
    font-size:28px;
    margin-bottom:10px
}

.card p{
    line-height:1.8;
    opacity:.75;
    margin-bottom:20px
}

.round-options{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin:0 0 18px
}

.round-option{
    padding:8px 4px;
    background:rgba(255,255,255,.18);
    color:#fff
}

.round-option.selected{
    background:#e0b44e;
    color:#382604
}

.start-btn{
    width:100%;
    font-size:16px;
    padding:13px
}

.lack-btn{
    margin:3px;
    padding:7px 12px;
    font-size:12px
}

@media(max-width:700px){

    .topbar{
        height:54px;
        padding:0 12px
    }

    .title{
        font-size:17px
    }

    .back{
        font-size:13px;
        padding:7px 11px
    }

    .game{
        width:100%;
        min-height:820px;
        height:auto;
        padding-bottom:190px
    }

    .table{
        width:94vw;
        height:440px;
        border-width:9px;
        border-radius:22px
    }

    .center{
        width:165px;
        height:110px
    }

    .round{
        font-size:20px
    }

    .tile{
        width:25px;
        height:42px;
        font-size:18px
    }

    .tile.drawn{
        margin-left:5px
    }

    .my-hand{
        bottom:-52px;
        gap:1px
    }

    .my-melds{
        bottom:-92px
    }

    .discards{
        width:210px;
        margin-top:78px
    }

    .player-prompt{bottom:65px}
    .player-discards .discard{width:18px;height:24px;font-size:11px}
    .north-discards{top:88px;width:135px}
    .west-discards{left:48px;width:24px}
    .east-discards{right:48px;width:24px}
    .south-discards{bottom:85px;width:150px}

    .discard{
        width:21px;
        height:29px;
        font-size:13px
    }

    .controls{
        bottom:10px;
        right:auto;
        left:50%;
        transform:translateX(-50%);
        width:95vw;
        justify-content:center
    }

    button{
        padding:9px 12px;
        font-size:13px
    }

    .ai-tile{
        width:12px;
        height:18px
    }

    .vertical .ai-tile{
        width:18px;
        height:12px
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="title">🀄 四川麻将 · 血战到底</div>
    <a class="back" href="../index.html">← 游戏大厅</a>
</header>

<main class="game">

<div class="seat-summary">
    <div class="seat-summary-item" id="southInfo"></div>
    <div class="seat-summary-item" id="northInfo"></div>
    <div class="seat-summary-item" id="westInfo"></div>
    <div class="seat-summary-item" id="eastInfo"></div>
</div>

<div class="table">

    <div class="ai-position ai-north">
        <div class="ai-hand" id="northHand"></div>
    </div>

    <div class="ai-position ai-west vertical">
        <div class="ai-hand" id="westHand"></div>
    </div>

    <div class="ai-position ai-east vertical">
        <div class="ai-hand" id="eastHand"></div>
    </div>

    <div class="center">
        <div class="round" id="roundInfo">第 1 / 4 局</div>
        <div class="wall" id="centerWall">牌墙：108</div>
    </div>

    <div class="player-discards north-discards" id="northDiscards"></div>
    <div class="player-discards west-discards" id="westDiscards"></div>
    <div class="player-discards east-discards" id="eastDiscards"></div>
    <div class="player-discards south-discards" id="southDiscards"></div>

    <div class="table-melds north-melds" id="northMelds"></div>
    <div class="table-melds west-melds" id="westMelds"></div>
    <div class="table-melds east-melds" id="eastMelds"></div>

    <div class="my-hand" id="myHand"></div>
    <div class="my-melds" id="myMelds" aria-label="玩家副露"></div>

</div>

<div class="controls">
    <button id="confirmExchangeBtn">确认换三张</button>
    <button id="pengBtn">碰</button>
    <button id="passBtn">过</button>
    <button id="gangBtn">杠</button>
    <button id="huBtn">胡</button>
</div>

<div class="player-prompt">
    <div class="status" id="status">等待开始</div>
    <div class="timer" id="timer"></div>
</div>

<div class="start" id="startScreen">
    <div class="card">
        <h1>🀄 血战到底</h1>
        <p>
            四川麻将单机版<br>
            108 张牌 · 你 + 3 名 AI
        </p>
        <div class="round-options" id="roundOptions">
            <button class="round-option" data-rounds="2">2局</button>
            <button class="round-option selected" data-rounds="4">4局</button>
            <button class="round-option" data-rounds="8">8局</button>
            <button class="round-option" data-rounds="16">16局</button>
        </div>
        <button class="primary start-btn" id="startBtn">
            开始游戏
        </button>
    </div>
</div>

<div class="result hidden" id="resultScreen">
    <div class="result-card">
        <h2>本局结束</h2>
        <p class="result-message" id="resultMessage"></p>
        <ul class="result-list" id="resultList"></ul>
        <button class="primary start-btn" id="restartBtn">再来一局</button>
    </div>
</div>

</main>

<script>

"use strict";

const suits = ["万","条","筒"];

let wall = [];
let playerHand = [];
let aiHands = [[],[],[]];
let aiMelds = [[],[],[]];

let playerLack = null;
let aiLacks = [null,null,null];

let phase = "waiting";

let selectedTiles = [];

let pendingHu = false;
let playerMelds = [];
let pendingPeng = null;
let pendingDiscardHu = null;
let nextAiIndexAfterPlayerDiscard = 0;
let activePlayers = [true,true,true,true];
let winners = [];
let winRecords = [];
let lastDrawWasGang = false;
let drawnTile = null;
let playerTimerId = null;
let playerTimerSeconds = 0;
let matchRounds = 4;
let currentRound = 0;
let totalScores = [0,0,0,0];
let roundScores = [0,0,0,0];
let dealerSeat = 0;
let lastDiscardEl = null;
let activeSeat = null;
let scoreEvents = [];
let roundEndedByDraw = false;
let discardHistory = [];


// =============================
// DOM
// =============================

const playerHandEl =
    document.getElementById("myHand");

const playerMeldsEl =
    document.getElementById("myMelds");

const wallEl =
    document.getElementById("centerWall");

const discardEls = [
    document.getElementById("southDiscards"),
    document.getElementById("westDiscards"),
    document.getElementById("northDiscards"),
    document.getElementById("eastDiscards")
];

const seatInfoEls = [
    document.getElementById("southInfo"),
    document.getElementById("westInfo"),
    document.getElementById("northInfo"),
    document.getElementById("eastInfo")
];

const roundInfoEl =
    document.getElementById("roundInfo");

const statusEl =
    document.getElementById("status");

const timerEl =
    document.getElementById("timer");

const startBtn =
    document.getElementById("startBtn");

const roundOptionsEl =
    document.getElementById("roundOptions");

const startScreen =
    document.getElementById("startScreen");

const resultScreen =
    document.getElementById("resultScreen");

const resultMessageEl =
    document.getElementById("resultMessage");

const resultListEl =
    document.getElementById("resultList");

const restartBtn =
    document.getElementById("restartBtn");

const confirmExchangeBtn =
    document.getElementById("confirmExchangeBtn");

const pengBtn =
    document.getElementById("pengBtn");

const passBtn =
    document.getElementById("passBtn");

const gangBtn =
    document.getElementById("gangBtn");

const huBtn =
    document.getElementById("huBtn");

const northHandEl =
    document.getElementById("northHand");

const westHandEl =
    document.getElementById("westHand");

const eastHandEl =
    document.getElementById("eastHand");

const aiMeldEls = [
    document.getElementById("westMelds"),
    document.getElementById("northMelds"),
    document.getElementById("eastMelds")
];


// =============================
// 创建牌
// =============================

function createTiles(){

    const tiles = [];

    for(const suit of suits){

        for(let value=1;value<=9;value++){

            for(let copy=0;copy<4;copy++){

                tiles.push({
                    suit,
                    value,
                    id:
                        suit +
                        value +
                        "-" +
                        copy +
                        "-" +
                        Math.random()
                });

            }

        }

    }

    return tiles;
}


// =============================
// 洗牌
// =============================

function shuffle(arr){

    for(let i=arr.length-1;i>0;i--){

        const j =
            Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]] =
            [arr[j],arr[i]];
    }
}


// =============================
// 排序
// =============================

function sortHand(hand){

    const order = {
        "万":0,
        "条":1,
        "筒":2
    };

    hand.sort((a,b)=>{

        if(order[a.suit] !== order[b.suit]){

            return order[a.suit] -
                   order[b.suit];
        }

        return a.value-b.value;

    });
}

function tileLabel(tile){
    return `${tile.value}${tile.suit}`;
}


function aiDelay(){

    return 1000+Math.floor(Math.random()*2001);

}


function clearPlayerTimer(){

    clearInterval(playerTimerId);
    playerTimerId = null;
    playerTimerSeconds = 0;
    timerEl.textContent = "";

}


function startPlayerTimer(){

    clearPlayerTimer();

    if(phase==="waiting" || phase==="ended" || !activePlayers[0]){

        return;

    }

    playerTimerSeconds = 60;
    timerEl.textContent = "剩余 60 秒";

    playerTimerId = setInterval(()=>{

        playerTimerSeconds--;
        timerEl.textContent = `剩余 ${playerTimerSeconds} 秒`;

        if(playerTimerSeconds<=0){

            clearPlayerTimer();
            runAutomaticPlayerAction();

        }

    },1000);

}


function getLegalDiscardIndexes(){

    const hasLack = playerHand.some(tile=>tile.suit===playerLack);

    return playerHand
        .map((tile,index)=>({tile,index}))
        .filter(({tile})=>!hasLack || tile.suit===playerLack)
        .map(({index})=>index);

}


function runAutomaticPlayerAction(){

    if(phase==="exchange"){

        const suitsToExchange = suits.filter(suit=>
            playerHand.filter(tile=>tile.suit===suit).length>=3
        );

        const suit = suitsToExchange[
            Math.floor(Math.random()*suitsToExchange.length)
        ];

        selectedTiles = playerHand
            .map((tile,index)=>({tile,index}))
            .filter(({tile})=>tile.suit===suit)
            .slice(0,3)
            .map(({index})=>index);

        exchangeThree();

        return;

    }

    if(phase==="lack"){

        choosePlayerLack(
            suits[Math.floor(Math.random()*suits.length)]
        );

        return;

    }

    if(phase!=="playing"){

        return;

    }

    if(pendingDiscardHu){

        Math.random()<.5 ? takePendingDiscardHu() : passDiscardHu();

        return;

    }

    if(pendingPeng){

        Math.random()<.5 ? playerPeng() : passPeng();

        return;

    }

    const actions = [];

    if(pendingHu){

        actions.push(playerHu);

    }

    if(canGang()){

        actions.push(playerGang);

    }

    const legalDiscards = getLegalDiscardIndexes();

    if(legalDiscards.length){

        actions.push(()=>{
            const index = legalDiscards[
                Math.floor(Math.random()*legalDiscards.length)
            ];

            discardTile(index);
        });

    }

    if(actions.length){

        actions[Math.floor(Math.random()*actions.length)]();

    }

}


// =============================
// 开始游戏
// =============================

function beginMatch(){

    currentRound = 0;
    totalScores = [0,0,0,0];
    startGame();

}

function startGame(){

    currentRound++;
    roundScores = [0,0,0,0];

    const diceTwo = 1+Math.floor(Math.random()*6);

    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");

    playerHand = [];

    aiHands = [
        [],
        [],
        []
    ];

    aiMelds = [[],[],[]];

    playerLack = null;

    aiLacks = [
        null,
        null,
        null
    ];

    selectedTiles = [];

    pendingHu = false;

    playerMelds = [];
    pendingPeng = null;
    pendingDiscardHu = null;
    nextAiIndexAfterPlayerDiscard = 0;
    activePlayers = [true,true,true,true];

    winRecords = [];
    lastDrawWasGang = false;

    huBtn.style.display = "none";

    // 发牌
    for(let i=0;i<13;i++){

        }
    }

    sortHand(playerHand);

    aiHands.forEach(sortHand);

}

// =============================
// 换三张选择
// =============================

function toggleExchangeTile(index){

    if(selectedTiles.includes(index)){

        selectedTiles =
            selectedTiles.filter(
                i=>i!==index
            );

    }else{

        if(selectedTiles.length>=3){
            return;
        }

        if(selectedTiles.length>0){

            const firstSuit =
                playerHand[
                    selectedTiles[0]
                ].suit;

            if(
                playerHand[index].suit !==
                firstSuit
            ){

                statusEl.textContent =
                    "换三张必须选择同一种花色";

                return;
            }

        }

        selectedTiles.push(index);

    }

    renderPlayerHand();

    if(selectedTiles.length===3){

        confirmExchangeBtn.disabled = false;

        statusEl.textContent =
            "已选择3张，点击「确认换三张」";

    }else{

        confirmExchangeBtn.disabled = true;

        statusEl.textContent =
            `已选择 ${selectedTiles.length} 张`;

    }

}


// =============================
// AI选择换三张
// =============================

function chooseAIExchange(hand){

    const counts = {
        "万":0,
        "条":0,
        "筒":0
    };

    hand.forEach(tile=>{
        counts[tile.suit]++;
    });

    // 必须选择至少有3张的花色
    const available =
        suits.filter(
            suit=>counts[suit]>=3
        );

    let target = available[0];

    for(const suit of available){

        if(counts[suit] < counts[target]){

            target = suit;

        }

    }

    return hand
        .filter(tile=>tile.suit===target)
        .slice(0,3);

}


// =============================
// 换三张
// =============================

function exchangeThree(){

    if(selectedTiles.length!==3){

        statusEl.textContent =
            "必须选择3张同花色的牌";

        return;
    }

    const selected =
        selectedTiles.map(
            index=>playerHand[index]
        );

    const suit =
        selected[0].suit;

    if(
        !selected.every(
            tile=>tile.suit===suit
        )
    ){

        statusEl.textContent =
            "必须选择同一种花色";

        return;
    }

    const aiSelected =
        aiHands.map(
            hand=>chooseAIExchange(hand)
        );

    if(
        aiSelected.some(
            tiles=>tiles.length!==3
        )
    ){

        statusEl.textContent =
            "AI换三张失败，请重新开始";

        return;
    }

    /*
        换牌不再在玩家之间传递。
        每家从牌墙拿到三张同花色、且不同于交出花色的牌；
        四家交出的牌最后再洗回牌墙。
    */

    const outgoing = [selected,...aiSelected];
    const incoming = [];

    for(const tiles of outgoing){

        const replacements =
            takeReplacementTiles(tiles[0].suit);

        if(!replacements){

            wall.push(...incoming.flat());

            statusEl.textContent =
                "牌墙中没有足够的可换牌，请重新开始";

            return;

        }

        incoming.push(replacements);

    }

    playerHand = removeTiles(playerHand,selected);
    playerHand.push(...incoming[0]);

    for(let i=0;i<3;i++){

        aiHands[i] = removeTiles(aiHands[i],aiSelected[i]);
        aiHands[i].push(...incoming[i+1]);

    }

    wall.push(...outgoing.flat());
    shuffle(wall);

    sortHand(playerHand);

    aiHands.forEach(sortHand);

    selectedTiles = [];

    clearPlayerTimer();

    chooseLacks();

    phase = "lack";

    confirmExchangeBtn.style.display = "none";

    showLackButtons();

    render();

}


function takeReplacementTiles(originalSuit){

    const availableSuits = suits.filter(suit=>
        suit!==originalSuit &&
        wall.filter(tile=>tile.suit===suit).length>=3
    );

    if(!availableSuits.length){

        return null;

    }

    const replacementSuit = availableSuits[
        Math.floor(Math.random()*availableSuits.length)
    ];

    const replacements = [];

    for(let i=wall.length-1;i>=0 && replacements.length<3;i--){

        if(wall[i].suit===replacementSuit){

            replacements.push(wall.splice(i,1)[0]);

        }

    }

    return replacements;

}


// =============================
// 删除牌
// =============================

function removeTiles(hand,tiles){

    const result =
        hand.slice();

    for(const tile of tiles){

        const index =
            result.indexOf(tile);

        if(index!==-1){

            result.splice(index,1);

        }

    }

    return result;
}


// =============================
// AI定缺
// =============================

function chooseLacks(){

    for(let i=0;i<3;i++){

        aiLacks[i] =
            chooseAILack(
                aiHands[i]
            );

    }

}


function chooseAILack(hand){

    const counts = {
        "万":0,
        "条":0,
        "筒":0
    };

    hand.forEach(tile=>{
        counts[tile.suit]++;
    });

    let lack = suits[0];

    for(const suit of suits){

        if(
            counts[suit] <
            counts[lack]
        ){

            lack = suit;

        }

    }

    return lack;
}

// =============================
// 玩家摸牌
// =============================

function playerDraw(){

    if(phase!=="playing"){
        return;
    }

    if(!activePlayers[0]){

        aiTurn(0);

        return;

    }

    activeSeat = 0;

    if(wall.length===0){

        endGame("牌墙已经摸完，本局结束");

        return;
    }

    if(playerHand.length!==playerBaseHandSize()){
        return;
    }

    const tile =
        wall.pop();

    playerHand.push(tile);
    drawnTile = tile;

    pendingHu =
        canPlayerHu(playerHand);

    gangBtn.style.display =
        canGang() ? "" : "none";

    if(pendingHu){

        huBtn.style.display = "";
        huBtn.onclick = playerHu;

        statusEl.textContent =
            "你可以自摸胡牌！";

    }else{

        huBtn.style.display =
            "none";

        statusEl.textContent =
            "轮到你出牌";

    }

    render();

    startPlayerTimer();

}


// =============================
// 玩家出牌
// =============================

function discardTile(index){

    if(phase!=="playing"){
        return;
    }

    if(!activePlayers[0]){

        return;

    }

    if(playerHand.length!==playerBaseHandSize()+1){

        statusEl.textContent =
            "请先摸牌";

        return;
    }

    const tile =
        playerHand[index];

    // 定缺限制
    const hasLack =
        playerHand.some(
            t=>t.suit===playerLack
        );

    if(
        hasLack &&
        tile.suit!==playerLack
    ){

        statusEl.textContent =
            `你还有${playerLack}牌，必须先打定缺牌`;

        return;
    }

    clearPlayerTimer();

    playerHand.splice(
        index,
        1
    );

    drawnTile = null;
    sortHand(playerHand);

    addDiscard(tile,0);

    pendingHu = false;

    pendingPeng = null;
    lastDrawWasGang = false;

    huBtn.style.display =
        "none";

    gangBtn.style.display =
        "none";

    render();

    const aiHuSeats = getDiscardHuSeats(tile,0);

    if(aiHuSeats.length){

        resolveDiscardHu(
            aiHuSeats,
            tile,
            0,
            ()=>aiTurn(0)
        );

        return;

    }

    if(tryAiClaim(tile,0,()=>{})){
        return;
    }

    // AI行动
    const nextAiIndex = nextAiIndexAfterPlayerDiscard;

    nextAiIndexAfterPlayerDiscard = 0;

    setTimeout(
        ()=>aiTurn(nextAiIndex),
        aiDelay()
    );

}

playerHandEl.addEventListener(

            );

        if(index===-1){

        }

    }
);


// =============================
// AI行动
// =============================

function recordScoreEvent(label,from,to,amount){
    if(from===to || amount<=0){ return; }
    scoreEvents.push({label,from,to,amount});
}

function recordGangScore(kind,winner,source=null){
    const amount = kind==="暗杠" ? 2 : 1;
    if(kind==="明杠" && source!==null){
        recordScoreEvent(kind,source,winner,amount*2);
        return;
    }
    for(let seat=0;seat<4;seat++){
        if(seat!==winner && activePlayers[seat]){
            recordScoreEvent(kind,seat,winner,amount);
        }
    }
}

function aiCanClaim(index,tile){
    if(!activePlayers[index+1]){ return null; }
    const matches = aiHands[index].filter(card=>card.suit===tile.suit && card.value===tile.value);
    if(matches.length>=3){ return {kind:"明杠",tiles:matches.slice(0,3)}; }
    if(matches.length>=2 && Math.random()<.7){ return {kind:"碰",tiles:matches.slice(0,2)}; }
    return null;
}

function tryAiClaim(tile,sourceSeat,continueGame){
    const candidateCount=sourceSeat===0 ? 3 : 2;
    for(let offset=1;offset<=candidateCount;offset++){
        const seat=((sourceSeat-1+offset)%3)+1;
        const index=seat-1;
        const claim=aiCanClaim(index,tile);
        if(!claim){ continue; }
        aiHands[index]=removeTiles(aiHands[index],claim.tiles);
        const meld=[...claim.tiles,tile];
        meld.kind=claim.kind==="碰" ? "peng" : "gang";
        aiMelds[index].push(meld);
        if(lastDiscardEl){ lastDiscardEl.remove(); }
        if(claim.kind==="明杠"){ recordGangScore("明杠",seat,sourceSeat); }
        activeSeat=seat;
        statusEl.textContent=`AI${seat}${claim.kind} ${tileLabel(tile)}，${claim.kind==="明杠" ? "正在补牌" : "正在出牌"}`;
        render();
        setTimeout(()=>aiTurnOne(index,claim.kind==="碰"),aiDelay());
        return true;
    }
    continueGame();
    return false;
}

function aiTurn(startIndex=0){

    if(phase!=="playing"){
        return;
    }

    aiTurnOne(startIndex);

}


function aiTurnOne(index,skipDraw=false){

    if(
        phase!=="playing" ||
        index>=3
    ){

        if(phase==="playing"){

            playerDraw();

        }

        return;
    }

    if(!activePlayers[index+1]){

        setTimeout(
            ()=>aiTurnOne(index+1),
            aiDelay()
        );

        return;

    }

    activeSeat = index+1;

    if(wall.length===0 && !skipDraw){

        endGame(
            "牌墙已经摸完，本局结束"
        );

        return;
    }

    const hand =
        aiHands[index];

    // 被碰/明杠后直接出牌；正常回合先摸牌。
    if(!skipDraw){
        hand.push(wall.pop());
        sortHand(hand);
    }

    render();

    const aiGangTiles = findFourTiles(hand);

    if(aiGangTiles){

        aiHands[index] = removeTiles(hand,aiGangTiles);
        aiMelds[index].push(aiGangTiles);
        aiGangTiles.kind = "gang";
        aiGangTiles.concealed = true;
        recordGangScore("暗杠",index+1);
        statusEl.textContent = `AI${index+1}暗杠，正在补牌`;
        render();

        setTimeout(
            ()=>aiTurnOne(index),
            aiDelay()
        );

        return;

    }

    // AI自摸
    if(
        canAIHu(index,hand)
    ){

        declareWin(
            index+1,
            `AI${index+1}自摸胡牌！`,
            ()=>aiTurnOne(index+1)
        );

        return;
    }

    // AI出牌
    const discardIndex =
        chooseAIDiscard(
            hand,
            aiLacks[index]
        );

    const tile =
        hand.splice(
            discardIndex,
            1
        )[0];

    addDiscard(tile,index+1);

    render();

    const huSeats = getDiscardHuSeats(tile,index+1);

    if(huSeats.length){

        if(huSeats.includes(0)){

            offerDiscardHu(
                huSeats,
                tile,
                index+1,
                ()=>aiTurnOne(index+1)
            );

        }else{

            resolveDiscardHu(
                huSeats,
                tile,
                index+1,
                ()=>aiTurnOne(index+1)
            );

        }

        return;

    }

    if(canPeng(tile)){

        offerPeng(tile,index);

        return;

    }

    if(tryAiClaim(tile,index+1,()=>setTimeout(()=>aiTurnOne(index+1),aiDelay()))){
        return;
    }


}


// =============================
// 多家同时胡
// =============================

function getDiscardHuSeats(tile,discarderSeat){

    const huSeats = [];

    for(let seat=0;seat<4;seat++){

        if(seat===discarderSeat || !activePlayers[seat]){

            continue;

        }

        if(seat===0){

            const testHand = playerHand.concat([tile]);

            if(
                testHand.length===14-playerMelds.length*3 &&
                canPlayerHu(testHand)
            ){

                huSeats.push(seat);

            }

        }else if(canAIHu(seat-1,aiHands[seat-1].concat([tile]))){

            huSeats.push(seat);

        }

    }

    return huSeats;

}


function offerDiscardHu(huSeats,tile,discarderSeat,continueGame){

    pendingDiscardHu = {
        huSeats,
        tile,
        discarderSeat,
        continueGame
    };

    pendingHu = true;
    pengBtn.style.display = "none";
    huBtn.style.display = "";
    passBtn.style.display = "";
    huBtn.onclick = takePendingDiscardHu;
    passBtn.onclick = passDiscardHu;

    const otherWinners = huSeats.filter(seat=>seat!==0).length;

    statusEl.textContent = otherWinners
        ? `可一炮多响：你与 ${otherWinners} 家可胡，请选择「胡」或「过」`
        : `AI${discarderSeat}打出 ${tileLabel(tile)}，你可以胡，请选择「胡」或「过」`;

    startPlayerTimer();

}


function takePendingDiscardHu(){

    if(!pendingDiscardHu){

        return;

    }

    const pending = pendingDiscardHu;

    clearPlayerTimer();
    pendingDiscardHu = null;
    resolveDiscardHu(
        pending.huSeats,
        pending.tile,
        pending.discarderSeat,
        pending.continueGame
    );

}


function passDiscardHu(){

    if(!pendingDiscardHu){

        return;

    }

    const pending = pendingDiscardHu;

    clearPlayerTimer();
    pendingDiscardHu = null;
    const aiHuSeats = pending.huSeats.filter(seat=>seat!==0);

    if(aiHuSeats.length){

        resolveDiscardHu(
            aiHuSeats,
            pending.tile,
            pending.discarderSeat,
            pending.continueGame
        );

    }else{

        huBtn.style.display = "none";
        passBtn.style.display = "none";
        pendingHu = false;
        pending.continueGame();

    }

}


function resolveDiscardHu(huSeats,tile,discarderSeat,continueGame){

    const names = huSeats.map(seat=>seat===0 ? "你" : `AI${seat}`);
    const discarderName = discarderSeat===0 ? "你" : `AI${discarderSeat}`;

    declareWins(
        huSeats,
        `${names.join("、")}胡了 ${tileLabel(tile)}（${discarderName}放炮）！`,
        continueGame,
        "点炮",
        discarderSeat
    );

}


// =============================
// 碰
// =============================

function playerBaseHandSize(){

    return 13-playerMelds.length*3;

}


function canPeng(tile){

    if(!activePlayers[0]){

        return false;

    }

    if(playerHand.length!==playerBaseHandSize()){

        return false;

    }

    return playerHand.filter(
        handTile=>
            handTile.suit===tile.suit &&
            handTile.value===tile.value
    ).length>=2;

}


function offerPeng(tile,sourceIndex){

    pendingPeng = {
        tile,
        sourceIndex,
        discardEl:lastDiscardEl
    };

    pengBtn.style.display = "";
    pengBtn.disabled = false;
    pengBtn.onclick = playerPeng;

    passBtn.style.display = "";
    passBtn.disabled = false;
    passBtn.onclick = passPeng;

    gangBtn.style.display =
        findDiscardGangTiles() ? "" : "none";

    statusEl.textContent =
        `AI${sourceIndex+1}打出 ${tileLabel(tile)}，请选择「碰」或「过」`;

    startPlayerTimer();

}


function passPeng(){

    if(!pendingPeng || phase!=="playing"){

        return;

    }

    const sourceIndex = pendingPeng.sourceIndex;
    const tile = pendingPeng.tile;

    clearPlayerTimer();
    pendingPeng = null;
    pengBtn.style.display = "none";
    passBtn.style.display = "none";
    gangBtn.style.display = "none";

    tryAiClaim(
        tile,
        sourceIndex+1,
        ()=>setTimeout(()=>aiTurnOne(sourceIndex+1),aiDelay())
    );

}


function playerPeng(){

    if(!pendingPeng || phase!=="playing"){

        return;

    }

    const {tile,sourceIndex,discardEl} = pendingPeng;

    clearPlayerTimer();

    const matchingTiles = playerHand.filter(
        handTile=>
            handTile.suit===tile.suit &&
            handTile.value===tile.value
    ).slice(0,2);

    if(matchingTiles.length!==2){

    }

    playerHand = removeTiles(playerHand,matchingTiles);
    const meld = [...matchingTiles,tile];

    playerMelds.push(meld);

    }

    pendingPeng = null;
    pengBtn.style.display = "none";
    passBtn.style.display = "none";

}

// 暗杠
// =============================

function findGangTiles(){

    return findFourTiles(playerHand);

}


function findFourTiles(hand){

    for(const tile of hand){

        const matchingTiles = hand.filter(
            handTile=>
                handTile.suit===tile.suit &&
                handTile.value===tile.value
        );

        if(matchingTiles.length===4){

            return matchingTiles;

        }

    }

    return null;

}


function canGang(){

    if(pendingPeng){

        return Boolean(findDiscardGangTiles());

    }

    return playerHand.length===playerBaseHandSize()+1 &&
        (Boolean(findGangTiles()) || Boolean(findAddedGang()));

}


function findAddedGang(){

    return playerMelds.find(meld=>
        meld.kind==="peng" &&
        playerHand.some(tile=>
            tile.suit===meld[0].suit &&
            tile.value===meld[0].value
        )
    );

}


function findDiscardGangTiles(){

    if(!pendingPeng){

        return null;

    }

    const matches = playerHand.filter(tile=>
        tile.suit===pendingPeng.tile.suit &&
        tile.value===pendingPeng.tile.value
    );

    return matches.length>=3 ? matches.slice(0,3) : null;

}


function playerGang(){

    if(phase!=="playing"){

        return;

    }

    const gangTiles = findGangTiles();
    const addedMeld = findAddedGang();
    const discardGangTiles = findDiscardGangTiles();

    if(!canGang()){

        statusEl.textContent = "当前没有可暗杠的四张相同牌";

        return;

    }

    // 补杠的第四张牌可以被其余仍在场的玩家抢杠胡。
    if(addedMeld && !discardGangTiles){
        const extraTile = playerHand.find(tile=>
            tile.suit===addedMeld[0].suit && tile.value===addedMeld[0].value
        );
        const robbers=[];
        for(let seat=1;seat<4;seat++){
            if(activePlayers[seat] && canAIHu(seat-1,aiHands[seat-1].concat([extraTile]))){
                robbers.push(seat);
            }
        }
        if(robbers.length){
            clearPlayerTimer();
            playerHand=removeTiles(playerHand,[extraTile]);
            addDiscard(extraTile,0);
            declareWins(
                robbers,
                `你补杠 ${tileLabel(extraTile)} 被抢杠胡！`,
                ()=>aiTurn(0),
                "点炮",
                0
            );
            return;
        }
    }

    clearPlayerTimer();

    let gangTile;
    let gangKind;

    if(discardGangTiles){

        const pending = pendingPeng;

        playerHand = removeTiles(playerHand,discardGangTiles);
        const meld = [...discardGangTiles,pending.tile];
        meld.kind = "gang";
        playerMelds.push(meld);
        if(pending.discardEl){
            pending.discardEl.remove();
        }
        pendingPeng = null;
        pengBtn.style.display = "none";
        passBtn.style.display = "none";
        gangTile = pending.tile;
        gangKind = "明杠";
        recordGangScore(gangKind,0,pending.sourceIndex+1);

    }else if(addedMeld){

        const extraTile = playerHand.find(tile=>
            tile.suit===addedMeld[0].suit &&
            tile.value===addedMeld[0].value
        );

        playerHand = removeTiles(playerHand,[extraTile]);
        addedMeld.push(extraTile);
        addedMeld.kind = "gang";
        gangTile = extraTile;
        gangKind = "补杠";
        recordGangScore(gangKind,0);

    }else{

        playerHand = removeTiles(playerHand,gangTiles);
        gangTiles.kind = "gang";
        playerMelds.push(gangTiles);
        gangTile = gangTiles[0];
        gangKind = "暗杠";
        recordGangScore(gangKind,0);

    }

    lastDrawWasGang = true;
    drawnTile = null;

    gangBtn.style.display = "none";
    huBtn.style.display = "none";
    pendingHu = false;

    render();

    statusEl.textContent =
        `你${gangKind} ${tileLabel(gangTile)}，正在补牌`;

    setTimeout(playerDraw,300);

}


// =============================
// AI出牌策略
// =============================

function chooseAIDiscard(hand,lack){

    const lackIndexes = [];

    hand.forEach(
        (tile,index)=>{

            if(tile.suit===lack){

                lackIndexes.push(index);

            }

        }
    );

    if(lackIndexes.length){

        return lackIndexes[
            Math.floor(
                Math.random() *
                lackIndexes.length
            )
        ];

    }

    let bestIndexes = [];
    let lowestKeepScore = Infinity;

    hand.forEach((tile,index)=>{

        const keepScore = getAITileKeepScore(tile,hand);

        if(keepScore<lowestKeepScore){

            lowestKeepScore = keepScore;
            bestIndexes = [index];

        }else if(keepScore===lowestKeepScore){

            bestIndexes.push(index);

        }

    });

    return bestIndexes[
        Math.floor(Math.random()*bestIndexes.length)
    ];

}


function getAITileKeepScore(tile,hand){

    const sameTiles = hand.filter(handTile=>
        handTile.suit===tile.suit &&
        handTile.value===tile.value
    ).length;

    const nearbyTiles = hand.filter(handTile=>
        handTile.suit===tile.suit &&
        handTile.value!==tile.value &&
        Math.abs(handTile.value-tile.value)<=2
    ).length;

    const afterDiscard = hand.filter(card=>card!==tile);
    const waits = countWaitingTiles(afterDiscard);
    const exposed = discardHistory.filter(card=>card.suit===tile.suit && card.value===tile.value).length;
    let score = (sameTiles-1)*6 + nearbyTiles*2 + waits*3 - exposed;

    if(tile.value===1 || tile.value===9){

        score -= 1;

    }

    return score;

}

function countWaitingTiles(hand){
    if(hand.length%3!==1){ return 0; }
    let count=0;
    for(const suit of suits){
        for(let value=1;value<=9;value++){
            if(canHu(hand.concat([{suit,value}]))){ count++; }
        }
    }
    return count;
}

function addDiscard(tile,seat){

}


// =============================
// 胡牌判断
// =============================

function isSevenPairs(hand){

    if(hand.length!==14){

        return false;

    }

    const counts = {};

    hand.forEach(tile=>{

        const key = tile.suit + tile.value;

        counts[key] = (counts[key]||0)+1;

    });

    return Object.values(counts).every(count=>count%2===0);

}


function getSeatTiles(seat){

    if(seat===0){

        return playerHand.concat(...playerMelds);

    }

    return aiHands[seat-1].concat(...aiMelds[seat-1]);

}


function isPureSuit(tiles){

    return new Set(tiles.map(tile=>tile.suit)).size===1;

}

function tileCounts(tiles){
    const counts={};
    tiles.forEach(tile=>{ const key=tile.suit+tile.value; counts[key]=(counts[key]||0)+1; });
    return counts;
}

function isDragonSevenPairs(hand){
    return isSevenPairs(hand) && Object.values(tileCounts(hand)).some(count=>count===4);
}

function isGoldHook(hand,meldCount){
    return meldCount===4 && hand.length===2 && hand[0].suit===hand[1].suit && hand[0].value===hand[1].value;
}

function isJiangDui(tiles,hand,meldCount){
    return tiles.every(tile=>[2,5,8].includes(tile.value)) && isAllTriplets(hand,meldCount);
}

function isAllTerminals(tiles){
    return tiles.every(tile=>tile.value===1 || tile.value===9);
}

function isAllWithTerminals(hand,melds){
    if(melds.some(meld=>!meld.some(tile=>tile.value===1 || tile.value===9))){
        return false;
    }
    const counts=tileCounts(hand);
    const keys=Object.keys(counts);
    const removeGroup=(group)=>{
        const copy={...counts};
        for(const key of group){ if(!copy[key]){ return null; } copy[key]--; }
        return copy;
    };
    const solve=(left)=>{
        const first=Object.keys(left).find(key=>left[key]>0);
        if(!first){ return true; }
        const suit=first.charAt(0), value=Number(first.slice(1));
        if(left[first]>=3 && (value===1 || value===9)){
            const copy={...left}; copy[first]-=3;
            if(solve(copy)){ return true; }
        }
        if(value===1 && left[suit+"2"]>0 && left[suit+"3"]>0){
            const copy={...left}; copy[first]--; copy[suit+"2"]--; copy[suit+"3"]--;
            if(solve(copy)){ return true; }
        }
        if(value===7 && left[suit+"8"]>0 && left[suit+"9"]>0){
            const copy={...left}; copy[first]--; copy[suit+"8"]--; copy[suit+"9"]--;
            if(solve(copy)){ return true; }
        }
        return false;
    };
    for(const pair of keys){
        if(counts[pair]<2 || ![1,9].includes(Number(pair.slice(1)))){ continue; }
        const rest={...counts}; rest[pair]-=2;
        if(solve(rest)){ return true; }
    }
    return false;
}


function isAllTriplets(hand,meldCount){

    if(hand.length!==14-meldCount*3){

        return false;

    }

    const counts = {};

    hand.forEach(tile=>{

        const key = tile.suit + tile.value;

        counts[key] = (counts[key]||0)+1;

    });

    return Object.values(counts).filter(count=>count%3===2).length===1 &&
        Object.values(counts).every(count=>count%3===0 || count%3===2);

}


function calculateFan(seat,method){

    const hand = seat===0 ? playerHand : aiHands[seat-1];
    const meldCount = seat===0 ? playerMelds.length : aiMelds[seat-1].length;
    const melds = seat===0 ? playerMelds : aiMelds[seat-1];
    const tiles = getSeatTiles(seat);
    const patterns = ["平胡"];
    let fan = 1;

    if(method==="自摸"){

        fan += 1;
        patterns.push("自摸");

    }

    if(isDragonSevenPairs(hand) && meldCount===0){

        fan += 4;
        patterns.push("龙七对");

    }else if(isSevenPairs(hand) && meldCount===0){

        fan += 2;
        patterns.push("七对");

    }else if(isAllTriplets(hand,meldCount)){

        fan += 2;
        patterns.push("碰碰胡");

    }

    if(isPureSuit(tiles)){

        fan += 4;
        patterns.push("清一色");

    }

    if(isPureSuit(tiles) && isSevenPairs(hand) && meldCount===0){
        patterns.push("清七对");
    }

    if(isGoldHook(hand,meldCount)){
        fan += 4;
        patterns.push("金钩钓");
    }

    if(isJiangDui(tiles,hand,meldCount)){
        fan += 4;
        patterns.push("将对");
    }

    if(isAllTerminals(tiles)){
        fan += 4;
        patterns.push("全幺九");
    }

    if(isAllWithTerminals(hand,melds)){
        fan += 2;
        patterns.push("全带幺");
    }

    if(seat===0 && method==="自摸" && lastDrawWasGang){

        fan += 2;
        patterns.push("杠上花");

    }

    if(fan>8){
        fan=8;
        patterns.push("8番封顶");
    }

    return {fan,patterns};

}

function canPlayerHu(hand){

    return !hand.some(tile=>tile.suit===playerLack) &&
        canHu(hand,playerMelds.length);

}


function canAIHu(index,hand){

    return !hand.some(tile=>tile.suit===aiLacks[index]) &&
        canHu(hand,aiMelds[index].length);

}


function canHu(hand,meldCount=0){

    if(hand.length!==14-meldCount*3){
        return false;
    }

    if(meldCount===0 && isSevenPairs(hand)){

        return true;

    }

    /*
        四川麻将这里只先实现：
        1对子 + 4组顺子/刻子
    */

    const counts = {};

    hand.forEach(tile=>{

        const key =
            tile.suit +
            tile.value;

        counts[key] =
            (counts[key]||0)+1;

    });

    const keys =
        Object.keys(counts);

    for(const pair of keys){

        if(counts[pair]<2){
            continue;
        }

        counts[pair]-=2;

        const remaining = [];

        for(const key of keys){

            for(
                let i=0;
                i<counts[key];
                i++
            ){

                remaining.push(key);

            }

        }

        remaining.sort((a,b)=>{

            const suitOrder = {"万":0,"条":1,"筒":2};
            const suitDifference =
                suitOrder[a.charAt(0)]-suitOrder[b.charAt(0)];

            if(suitDifference!==0){

                return suitDifference;

            }

            return Number(a.slice(1))-Number(b.slice(1));

        });

        if(
            canFormSets(
                remaining
            )
        ){

            counts[pair]+=2;

            return true;

        }

        counts[pair]+=2;

    }

    return false;

}


// =============================
// 判断剩余牌
// =============================

function canFormSets(cards){

    if(cards.length===0){
        return true;
    }

    const first =
        cards[0];

    const suit =
        first.charAt(0);

    const value =
        Number(
            first.slice(1)
        );

    // 刻子
    let count=0;

    for(const card of cards){

        if(card===first){
            count++;
        }

    }

    if(count>=3){

        const remaining =
            cards.slice();

        let removed=0;

        for(
            let i=remaining.length-1;
            i>=0;
            i--
        ){

            if(
                remaining[i]===first &&
                removed<3
            ){

                remaining.splice(i,1);

                removed++;

            }

        }

        if(
            canFormSets(
                remaining
            )
        ){

            return true;

        }

    }

    // 顺子
    if(value<=7){

        const second =
            suit+(value+1);

        const third =
            suit+(value+2);

        if(
            cards.includes(second) &&
            cards.includes(third)
        ){

            const remaining =
                cards.slice();

            removeOne(
                remaining,
                first
            );

            removeOne(
                remaining,
                second
            );

            removeOne(
                remaining,
                third
            );

            if(
                canFormSets(
                    remaining
                )
            ){

                return true;

            }

        }

    }

    return false;

}


function removeOne(arr,value){

    const index =
        arr.indexOf(value);

    if(index!==-1){

        arr.splice(
            index,
            1
        );

    }

}

function declareWins(seatsToWin,message,continueGame,method="点炮",payerSeat=null){

    const validWinners = seatsToWin.filter(
        seat=>activePlayers[seat] && phase==="playing"
    );

    if(!validWinners.length){

        return;

    }

    const seatElements = seatInfoEls;

    validWinners.forEach(seat=>{

        const result = calculateFan(seat,method);

        activePlayers[seat] = false;
        winners.push(seat);
        winRecords.push({seat,method,payerSeat,...result});

        if(seatElements[seat]){

            seatElements[seat].classList.add("out");

        }

    });

    pendingHu = false;
    pendingPeng = null;
    pendingDiscardHu = null;
    clearPlayerTimer();
    huBtn.style.display = "none";
    pengBtn.style.display = "none";
    passBtn.style.display = "none";
    gangBtn.style.display = "none";

    const remainingPlayers = activePlayers.filter(Boolean).length;
    const fanText = winRecords
        .filter(record=>validWinners.includes(record.seat))
        .map(record=>
            `${record.seat===0 ? "你" : `AI${record.seat}`}：${record.fan}番（${record.patterns.join("、")}）`
        )
        .join("；");

    if(remainingPlayers<=1){

        endGame(`${message} ${fanText} 血战到底结束。`);

        return;

    }

    statusEl.textContent =
        `${message} ${fanText}。已胡牌退出，剩余 ${remainingPlayers} 家继续。`;

    render();

    setTimeout(continueGame,aiDelay());

}

function showSettlement(message){

    resultListEl.innerHTML = "";

    document.querySelector(".result-card h2").textContent =

            item.append(name,detail);

        item.append(name,detail);
        resultListEl.appendChild(item);

    });

    restartBtn.textContent = isMatchOver ? "重新开始赛程" : "下一局";

}


function settleRoundScores(){

    roundScores = [0,0,0,0];

    scoreEvents.forEach(event=>{
        roundScores[event.from] -= event.amount;
        roundScores[event.to] += event.amount;
    });

    winRecords.forEach(record=>{

        if(record.method==="点炮" && record.payerSeat!==null){

            roundScores[record.seat] += record.fan;
            roundScores[record.payerSeat] -= record.fan;

        }else{

            for(let seat=0;seat<4;seat++){

                if(seat!==record.seat){

                    roundScores[seat] -= record.fan;
                    roundScores[record.seat] += record.fan;

                }

            }

        }

    });

    totalScores = totalScores.map(
        (score,seat)=>score+roundScores[seat]
    );

}

function isSeatReady(seat){
    const hand=seat===0 ? playerHand : aiHands[seat-1];
    const meldCount=seat===0 ? playerMelds.length : aiMelds[seat-1].length;
    const lack=seat===0 ? playerLack : aiLacks[seat-1];
    for(const suit of suits){
        for(let value=1;value<=9;value++){
            const test=hand.concat([{suit,value}]);
            if(!test.some(tile=>tile.suit===lack) && canHu(test,meldCount)){
                return true;
            }
        }
    }
    return false;
}

function applyDrawSettlement(){
    roundEndedByDraw=true;
    const flowerPigs=[];
    for(let seat=0;seat<4;seat++){
        if(!activePlayers[seat]){ continue; }
        const tiles=seat===0 ? playerHand : aiHands[seat-1];
        const lack=seat===0 ? playerLack : aiLacks[seat-1];
        if(tiles.some(tile=>tile.suit===lack)){ flowerPigs.push(seat); }
    }
    const cleanSeats=[0,1,2,3].filter(seat=>activePlayers[seat] && !flowerPigs.includes(seat));
    flowerPigs.forEach(from=>cleanSeats.forEach(to=>recordScoreEvent("查花猪",from,to,4)));

    const readySeats=cleanSeats.filter(isSeatReady);
    cleanSeats.filter(seat=>!readySeats.includes(seat)).forEach(from=>{
        readySeats.forEach(to=>recordScoreEvent("查叫",from,to,2));
    });

    // 未叫或花猪的杠分退回：只撤销该玩家本局已收取的杠分。
    const taxBackSeats=new Set([...flowerPigs,...cleanSeats.filter(seat=>!readySeats.includes(seat))]);
    scoreEvents.slice().filter(event=>["暗杠","明杠","补杠"].includes(event.label) && taxBackSeats.has(event.to))
        .forEach(event=>recordScoreEvent("退税",event.to,event.from,event.amount));
}

function endGame(message){

    phase = "ended";

    if(message.includes("牌墙已经摸完")){
        applyDrawSettlement();
    }

    pendingPeng = null;
    clearPlayerTimer();

    statusEl.textContent =
        message;

    huBtn.style.display =
        "none";

    pengBtn.style.display =
        "none";

    passBtn.style.display =
        "none";

    gangBtn.style.display =
        "none";

    render();

    settleRoundScores();

    showSettlement(message);

}

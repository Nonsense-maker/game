<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>四川麻将 · 血战到底</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle,#16734d,#0b4d35 60%,#063526);
    color:#fff;
    overflow-x:hidden
}
.topbar{
    height:60px;padding:0 18px;display:flex;align-items:center;
    justify-content:space-between;background:rgba(0,0,0,.25)
}
.title{font-size:20px;font-weight:700}
.back{
    color:#fff;text-decoration:none;background:rgba(255,255,255,.13);
    padding:8px 14px;border-radius:20px
}
.game{
    width:min(1100px,96vw);height:calc(100vh - 70px);
    min-height:620px;margin:auto;position:relative;
    display:flex;justify-content:center;align-items:center
}
.table{
    width:min(760px,78vw);height:520px;position:relative;
    border:14px solid #75461f;border-radius:30px;
    background:linear-gradient(145deg,#168254,#09603f);
    box-shadow:0 20px 50px rgba(0,0,0,.35)
}
.center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:220px;height:140px;border-radius:18px;
    background:rgba(0,0,0,.13);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:8px
}
.round{font-size:25px;font-weight:800}
.status{font-size:14px;opacity:.85}
.wall{font-size:13px;opacity:.7}
.player{
    position:absolute;display:flex;flex-direction:column;
    align-items:center;gap:5px;z-index:5
}
.name{
    padding:4px 10px;border-radius:14px;
    background:rgba(0,0,0,.3);font-size:13px
}
.avatar{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(145deg,#eee,#aaa);
    color:#333;border:3px solid rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;font-weight:bold
}
.north{left:50%;top:12px;transform:translateX(-50%)}
.west{left:10px;top:50%;transform:translateY(-50%)}
.east{right:10px;top:50%;transform:translateY(-50%)}
.south{left:50%;bottom:10px;transform:translateX(-50%)}
.active .name{background:#d6a743;color:#382604;font-weight:bold}

.ai-hand{display:flex;gap:2px}
.ai-tile{
    width:15px;height:22px;border-radius:3px;
    background:linear-gradient(135deg,#eee,#c8c8c8);
    border:1px solid #999
}
.vertical .ai-hand{flex-direction:column}
.vertical .ai-tile{width:22px;height:15px}

.my-hand{
    position:absolute;left:50%;bottom:-62px;
    transform:translateX(-50%);display:flex;
    gap:2px;align-items:flex-end;white-space:nowrap
}
.tile{
    width:39px;height:55px;border-radius:5px;
    background:linear-gradient(145deg,#fff,#e8e8e8);
    border:1px solid #aaa;color:#222;
    display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:bold;
    box-shadow:0 3px 5px rgba(0,0,0,.28);
    cursor:pointer;transition:.15s
}
.tile:hover{transform:translateY(-7px)}
.tile.selected{
    transform:translateY(-10px);
    box-shadow:0 0 0 2px #e0b44e
}
.discards{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    margin-top:105px;width:300px;
    min-height:70px;display:flex;flex-wrap:wrap;
    justify-content:center;align-content:flex-start;gap:3px
}
.discard{
    width:25px;height:34px;background:#f3f3f3;
    color:#222;border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;box-shadow:0 2px 3px rgba(0,0,0,.25)
}
.info{
    position:absolute;top:5px;left:50%;
    transform:translateX(-50%);display:flex;gap:8px;
    font-size:12px
}
.info span{
    background:rgba(0,0,0,.22);
    padding:5px 9px;border-radius:9px
}
.controls{
    position:absolute;bottom:0;right:0;
    display:flex;gap:8px
}
button{
    border:0;border-radius:9px;padding:10px 18px;
    font-weight:600;cursor:pointer;
    background:#fff;color:#174d37;
    box-shadow:0 3px 8px rgba(0,0,0,.25)
}
button.primary{background:#e0b44e;color:#382604}
.start{
    position:absolute;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.38);backdrop-filter:blur(4px);
    border-radius:18px
}
.card{
    width:min(360px,88vw);padding:30px 25px;
    border-radius:20px;text-align:center;
    background:rgba(20,70,50,.97);
    box-shadow:0 20px 50px rgba(0,0,0,.4)
}
.card h1{font-size:28px;margin-bottom:10px}
.card p{line-height:1.8;opacity:.75;margin-bottom:20px}
.start-btn{width:100%;font-size:16px;padding:13px}

@media(max-width:700px){
    .topbar{height:54px;padding:0 12px}
    .title{font-size:17px}
    .back{font-size:13px;padding:7px 11px}
    .game{width:100%;min-height:620px;height:calc(100vh - 60px)}
    .table{
        width:94vw;height:440px;border-width:9px;border-radius:22px
    }
    .center{width:165px;height:110px}
    .round{font-size:20px}
    .tile{width:25px;height:42px;font-size:18px}
    .my-hand{bottom:-52px;gap:1px}
    .discards{width:210px;margin-top:78px}
    .discard{width:21px;height:29px;font-size:13px}
    .controls{
        bottom:-125px;right:auto;left:50%;
        transform:translateX(-50%);width:95vw;
        justify-content:center
    }
    button{padding:9px 12px;font-size:13px}
}
</style>
</head>

<body>

<header class="topbar">
    <div class="title">🀄 四川麻将 · 血战到底</div>
    <a class="back" href="../index.html">← 游戏大厅</a>
</header>

<main class="game">

<div class="table">

    <div class="info">
        <span>第 1 局</span>
        <span id="wallInfo">剩余牌：56</span>
    </div>

    <div class="player north">
        <div class="name">AI · 北</div>
        <div class="avatar">北</div>
        <div class="ai-hand" id="northHand"></div>
    </div>

    <div class="player west vertical">
        <div class="name">AI · 西</div>
        <div class="avatar">西</div>
        <div class="ai-hand" id="westHand"></div>
    </div>

    <div class="player east vertical">
        <div class="name">AI · 东</div>
        <div class="avatar">东</div>
        <div class="ai-hand" id="eastHand"></div>
    </div>

    <div class="center">
        <div class="round">东一局</div>
        <div class="status" id="status">等待开始</div>
        <div class="wall" id="centerWall">牌墙：56</div>
    </div>

    <div class="discards" id="discards"></div>

    <div class="player south active">
        <div class="avatar">我</div>
        <div class="name">玩家</div>
    </div>

    <div class="my-hand" id="myHand"></div>

</div>

<div class="controls">
    <button id="drawBtn">摸牌</button>
    <button id="pengBtn">碰</button>
    <button id="gangBtn">杠</button>
    <button id="huBtn">胡</button>
</div>

<div class="start" id="startScreen">
    <div class="card">
        <h1>🀄 血战到底</h1>
        <p>
            四川麻将单机版<br>
            108 张牌 · 你 + 3 名 AI
        </p>
        <button class="primary start-btn" id="startBtn">开始游戏</button>
    </div>
</div>

</main>

<script>
const suits = ["万", "条", "筒"];
const tiles = [];

for (const suit of suits) {
    for (let number = 1; number <= 9; number++) {
        for (let copy = 0; copy < 4; copy++) {
            tiles.push({
                suit,
                number,
                text: number + suit
            });
        }
    }
}

let wall = [];
let playerHand = [];
let northHand = [];
let westHand = [];
let eastHand = [];

let started = false;
let phase = "waiting";
let selectedTiles = [];
let playerLack = null;

const myHandEl = document.getElementById("myHand");
const northHandEl = document.getElementById("northHand");
const westHandEl = document.getElementById("westHand");
const eastHandEl = document.getElementById("eastHand");
const wallInfo = document.getElementById("wallInfo");
const centerWall = document.getElementById("centerWall");
const statusEl = document.getElementById("status");
const discardsEl = document.getElementById("discards");
const startScreen = document.getElementById("startScreen");

const drawBtn = document.getElementById("drawBtn");
const pengBtn = document.getElementById("pengBtn");
const gangBtn = document.getElementById("gangBtn");
const huBtn = document.getElementById("huBtn");

const players = [
    {
        name: "玩家",
        hand: () => playerHand
    },
    {
        name: "北",
        hand: () => northHand
    },
    {
        name: "西",
        hand: () => westHand
    },
    {
        name: "东",
        hand: () => eastHand
    }
];

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function sortHand(hand) {
    const order = {
        "万": 0,
        "条": 1,
        "筒": 2
    };

    hand.sort((a, b) => {
        if (order[a.suit] !== order[b.suit]) {
            return order[a.suit] - order[b.suit];
        }

        return a.number - b.number;
    });
}

function updateWall() {
    wallInfo.textContent = "剩余牌：" + wall.length;
    centerWall.textContent = "牌墙：" + wall.length;
}

function createBackTiles(container, count) {
    container.innerHTML = "";

    for (let i = 0; i < count; i++) {
        const tile = document.createElement("i");
        tile.className = "ai-tile";
        container.appendChild(tile);
    }
}

function renderAIHands() {
    createBackTiles(northHandEl, northHand.length);
    createBackTiles(westHandEl, westHand.length);
    createBackTiles(eastHandEl, eastHand.length);
}

function renderPlayerHand() {
    myHandEl.innerHTML = "";

    playerHand.forEach((tile, index) => {
        const element = document.createElement("div");

        element.className = "tile";

        if (selectedTiles.includes(index)) {
            element.classList.add("selected");
        }

        element.textContent = tile.text;

        element.addEventListener("click", () => {
            handlePlayerTile(index);
        });

        myHandEl.appendChild(element);
    });
}

function handlePlayerTile(index) {
    if (phase === "exchange") {
        selectExchangeTile(index);
        return;
    }

    if (phase === "playing") {
        discardPlayerTile(index);
    }
}

function selectExchangeTile(index) {
    const existing = selectedTiles.indexOf(index);

    if (existing !== -1) {
        selectedTiles.splice(existing, 1);
        renderPlayerHand();
        updateExchangeStatus();
        return;
    }

    if (selectedTiles.length >= 3) {
        statusEl.textContent = "最多选择 3 张牌";
        return;
    }

    if (selectedTiles.length > 0) {
        const selectedSuit =
            playerHand[selectedTiles[0]].suit;

        if (playerHand[index].suit !== selectedSuit) {
            statusEl.textContent =
                "换三张必须选择同一花色";
            return;
        }
    }

    selectedTiles.push(index);

    renderPlayerHand();
    updateExchangeStatus();
}

function updateExchangeStatus() {
    statusEl.textContent =
        "换三张：请选择 3 张同一花色的牌（" +
        selectedTiles.length +
        "/3）";
}

function aiChooseExchange(hand) {
    const counts = {
        "万": 0,
        "条": 0,
        "筒": 0
    };

    hand.forEach(tile => {
        counts[tile.suit]++;
    });

    const leastSuit = Object.keys(counts).sort(
        (a, b) => counts[a] - counts[b]
    )[0];

    let result = hand.filter(
        tile => tile.suit === leastSuit
    );

    if (result.length < 3) {
        result = [...hand];
        shuffle(result);
        return result.slice(0, 3);
    }

    shuffle(result);
    return result.slice(0, 3);
}

function removeTiles(hand, selected) {
    for (const tile of selected) {
        const index = hand.indexOf(tile);

        if (index !== -1) {
            hand.splice(index, 1);
        }
    }
}

function exchangeThree() {
    if (phase !== "exchange") {
        return;
    }

    if (selectedTiles.length !== 3) {
        statusEl.textContent = "请选择 3 张牌";
        return;
    }

    const exchangeSuit =
        playerHand[selectedTiles[0]].suit;

    if (!selectedTiles.every(
        index => playerHand[index].suit === exchangeSuit
    )) {
        statusEl.textContent =
            "必须选择同一花色的 3 张牌";
        return;
    }

    const playerExchange =
        selectedTiles.map(index => playerHand[index]);

    const northExchange =
        aiChooseExchange(northHand);

    const westExchange =
        aiChooseExchange(westHand);

    const eastExchange =
        aiChooseExchange(eastHand);

    removeTiles(playerHand, playerExchange);
    removeTiles(northHand, northExchange);
    removeTiles(westHand, westExchange);
    removeTiles(eastHand, eastExchange);

    /*
     * 本局采用顺时针换三张：
     *
     * 玩家 → 北
     * 北 → 西
     * 西 → 东
     * 东 → 玩家
     */

    playerHand.push(...eastExchange);
    northHand.push(...playerExchange);
    westHand.push(...northExchange);
    eastHand.push(...westExchange);

    sortHand(playerHand);
    sortHand(northHand);
    sortHand(westHand);
    sortHand(eastHand);

    selectedTiles = [];

    renderPlayerHand();
    renderAIHands();

    phase = "lack";

    drawBtn.textContent = "请选择定缺";

    statusEl.textContent =
        "换三张完成，请选择定缺";

    showLackButtons();
}

function showLackButtons() {
    let old = document.getElementById("lackControls");

    if (old) {
        old.remove();
    }

    const container = document.querySelector(".controls");

    const lackControls = document.createElement("div");

    lackControls.id = "lackControls";
    lackControls.style.display = "flex";
    lackControls.style.gap = "5px";

    ["万", "条", "筒"].forEach(suit => {
        const button = document.createElement("button");

        button.textContent = "缺" + suit;

        button.addEventListener("click", () => {
            chooseLack(suit);
        });

        lackControls.appendChild(button);
    });

    container.appendChild(lackControls);
}

function chooseAILack(hand) {
    const counts = {
        "万": 0,
        "条": 0,
        "筒": 0
    };

    hand.forEach(tile => {
        counts[tile.suit]++;
    });

    return Object.keys(counts).sort(
        (a, b) => counts[a] - counts[b]
    )[0];
}

function chooseLack(suit) {
    if (phase !== "lack") {
        return;
    }

    playerLack = suit;

    const northLack = chooseAILack(northHand);
    const westLack = chooseAILack(westHand);
    const eastLack = chooseAILack(eastHand);

    console.log("玩家定缺：", playerLack);
    console.log("北定缺：", northLack);
    console.log("西定缺：", westLack);
    console.log("东定缺：", eastLack);

    const controls =
        document.getElementById("lackControls");

    if (controls) {
        controls.remove();
    }

    phase = "playing";

    drawBtn.textContent = "摸牌";

    statusEl.textContent =
        "你定缺：" + suit + "，游戏开始";

    setTimeout(() => {
        statusEl.textContent =
            "你的回合，请摸牌";
    }, 900);

    /*
     * 四川麻将换三张结束后，
     * 玩家此时有 13 张牌。
     *
     * 正常流程：
     * 摸一张 → 14 张 → 打一张 → 13 张
     */

    renderPlayerHand();
}

function deal() {
    wall = [...tiles];
    shuffle(wall);

    playerHand = [];
    northHand = [];
    westHand = [];
    eastHand = [];

    for (let i = 0; i < 13; i++) {
        playerHand.push(wall.pop());
        northHand.push(wall.pop());
        westHand.push(wall.pop());
        eastHand.push(wall.pop());
    }

    sortHand(playerHand);

    selectedTiles = [];
    playerLack = null;

    phase = "exchange";

    renderPlayerHand();
    renderAIHands();
    updateWall();

    drawBtn.textContent = "换三张";

    statusEl.textContent =
        "请选择 3 张同一花色的牌";

    pengBtn.style.display = "none";
    gangBtn.style.display = "none";
    huBtn.style.display = "none";
}

function drawForPlayer() {
    if (phase !== "playing") {
        return;
    }

    /*
     * 13 张 → 摸牌 → 14 张
     */

    if (playerHand.length !== 13) {
        statusEl.textContent =
            "请先打出一张牌";
        return;
    }

    if (wall.length === 0) {
        endRound();
        return;
    }

    const tile = wall.pop();

    playerHand.push(tile);

    sortHand(playerHand);

    renderPlayerHand();
    updateWall();

    statusEl.textContent =
        "你摸到了 " + tile.text + "，请选择一张牌打出";
}

function discardPlayerTile(index) {
    if (phase !== "playing") {
        return;
    }

    /*
     * 只有 14 张牌时才能出牌。
     */

    if (playerHand.length !== 14) {
        statusEl.textContent =
            "请先摸牌";
        return;
    }

    const tile = playerHand[index];

    /*
     * 定缺规则：
     * 定缺花色必须优先打掉。
     */

    if (tile.suit !== playerLack) {

        const hasLackTile =
            playerHand.some(
                item => item.suit === playerLack
            );

        if (hasLackTile) {
            statusEl.textContent =
                "你还有定缺牌，必须先打定缺花色";
            return;
        }
    }

    playerHand.splice(index, 1);

    addDiscard(tile, "玩家");

    renderPlayerHand();

    statusEl.textContent =
        "你打出了 " + tile.text;

    setTimeout(() => {
        aiTurn(0);
    }, 700);
}

function addDiscard(tile, playerName) {
    const element = document.createElement("div");

    element.className = "discard";
    element.textContent = tile.text;
    element.title = playerName;

    discardsEl.appendChild(element);
}

function aiDiscard(hand, lackSuit, name) {
    /*
     * AI 优先打定缺花色。
     */

    let candidates =
        hand.filter(tile => tile.suit === lackSuit);

    if (candidates.length === 0) {
        candidates = [...hand];
    }

    /*
     * 优先随机出牌。
     * 后面再升级成真正的 AI 牌效算法。
     */

    const tile =
        candidates[Math.floor(
            Math.random() * candidates.length
        )];

    const index = hand.indexOf(tile);

    hand.splice(index, 1);

    addDiscard(tile, name);

    return tile;
}

function aiTurn(index) {
    if (phase !== "playing") {
        return;
    }

    const aiPlayers = [
        {
            hand: northHand,
            lack: chooseAILack(northHand),
            name: "北"
        },
        {
            hand: westHand,
            lack: chooseAILack(westHand),
            name: "西"
        },
        {
            hand: eastHand,
            lack: chooseAILack(eastHand),
            name: "东"
        }
    ];

    if (index >= aiPlayers.length) {
        statusEl.textContent =
            "轮到你，请摸牌";
        return;
    }

    const ai = aiPlayers[index];

    statusEl.textContent =
        "AI · " + ai.name + " 思考中…";

    setTimeout(() => {

        if (wall.length === 0) {
            endRound();
            return;
        }

        /*
         * AI 摸牌
         */

        ai.hand.push(wall.pop());

        /*
         * AI 出牌
         */

        aiDiscard(
            ai.hand,
            ai.lack,
            ai.name
        );

        sortHand(ai.hand);

        renderAIHands();
        updateWall();

        /*
         * 下一个 AI
         */

        if (index + 1 < aiPlayers.length) {
            aiTurn(index + 1);
        } else {
            statusEl.textContent =
                "轮到你，请摸牌";
        }

    }, 650);
}

function endRound() {
    phase = "ended";

    statusEl.textContent =
        "牌墙已耗尽，本局结束";

    drawBtn.disabled = true;
}

function startGame() {
    started = true;

    startScreen.style.display = "none";

    discardsEl.innerHTML = "";

    drawBtn.disabled = false;

    deal();
}

document.getElementById("startBtn")
    .addEventListener("click", startGame);

drawBtn.addEventListener("click", () => {

    if (phase === "exchange") {
        exchangeThree();
        return;
    }

    if (phase === "lack") {
        statusEl.textContent =
            "请先选择定缺花色";
        return;
    }

    if (phase === "playing") {
        drawForPlayer();
    }
});

pengBtn.addEventListener("click", () => {
    if (phase === "playing") {
        statusEl.textContent =
            "碰牌功能下一阶段加入";
    }
});

gangBtn.addEventListener("click", () => {
    if (phase === "playing") {
        statusEl.textContent =
            "杠牌功能下一阶段加入";
    }
});

huBtn.addEventListener("click", () => {
    if (phase === "playing") {
        statusEl.textContent =
            "胡牌判定下一阶段加入";
    }
});
</script>

</body>
</html>
